<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0f172a">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="icon.png">
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">
    <title>GymUp - Alterar Senha</title>
</head>

<body>
    <div class="app-container">
        <header class="app-header dashboard-header">
            <div class="logo-container">
                <h1>GymUp</h1>
            </div>
            <p>Atualize sua senha de acesso</p>
        </header>

        <main class="app-content">
            <div class="search-card">
                <div id="alerta-feedback" class="alerta-feedback"></div>
                <form action="processar_alterar_senha.php" method="POST">
                    <div class="input-group">
                        <label for="senha_atual">Senha atual</label>
                        <input type="password" id="senha_atual" name="senha_atual" placeholder="********"
                            autocomplete="current-password" required>
                    </div>
                    <div class="input-group">
                        <label for="nova_senha">Nova senha</label>
                        <input type="password" id="nova_senha" name="nova_senha" placeholder="********"
                            autocomplete="new-password" required>
                    </div>
                    <div class="input-group">
                        <label for="confirma_nova_senha">Confirmar nova senha</label>
                        <input type="password" id="confirma_nova_senha" name="confirma_nova_senha"
                            placeholder="********" autocomplete="new-password" required>
                    </div>
                    <button type="submit" class="btn-primary">Salvar nova senha</button>
                </form>
                <div class="card-footer-link"><a href="perfil.html">Voltar ao perfil</a></div>
            </div>
        </main>

        <nav class="bottom-nav">
            <a href="index.html" class="nav-item">Início</a>
            <a href="historico.html" class="nav-item">Histórico</a>
            <a href="perfil.html" class="nav-item active">Perfil</a>
        </nav>
    </div>
    <script>
        const status = new URLSearchParams(window.location.search).get("status");
        const aviso = document.getElementById("alerta-feedback");
        function mostrar(tipo, texto) { aviso.className = "alerta-feedback " + tipo; aviso.textContent = texto; }
        if (status === "sucesso") mostrar("sucesso", "Senha alterada com sucesso!");
        else if (status === "senha_incorreta") mostrar("erro", "A senha atual está incorreta.");
        else if (status === "erro_coincidencia") mostrar("erro", "As novas senhas não coincidem.");
        else if (status === "erro_senha_curta") mostrar("erro", "A nova senha deve ter pelo menos 6 caracteres.");
        else if (status === "erro_senha_longa") mostrar("erro", "A nova senha é longa demais (máximo de 72 caracteres).");
        else if (status === "erro_senha_igual") mostrar("erro", "A nova senha deve ser diferente da senha atual.");
        else if (status === "erro_servidor") mostrar("erro", "Não foi possível alterar a senha. Tente novamente.");
    </script>
    <script src="mostrar-senha.js"></script>
    <script src="pwa.js"></script>
</body>

</html>
