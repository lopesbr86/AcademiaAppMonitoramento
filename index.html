<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="icon.png">
    <title>GymUp - Início</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f172a">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="splash" id="splash" role="status" aria-label="Carregando o GymUp">
        <div class="splash__meter" aria-hidden="true">
            <div class="splash__bar"></div>
            <div class="splash__bar"></div>
            <div class="splash__bar"></div>
            <div class="splash__bar"></div>
        </div>
        <p class="splash__logo">GymUp</p>
    </div>
    <script>
        (function () {
            var splash = document.getElementById('splash');
            if (!splash) return;

            try {
                if (sessionStorage.getItem('gymup-splash') === '1') { splash.remove(); return; }
            } catch (e) { }

            var MIN_MS = 2500;
            var MAX_MS = 8000;
            var start = Date.now();
            var done = false;

            function hide() {
                if (done) return;
                done = true;
                try { sessionStorage.setItem('gymup-splash', '1'); } catch (e) { }
                var wait = Math.max(0, MIN_MS - (Date.now() - start));
                setTimeout(function () {
                    splash.classList.add('splash--out');
                    setTimeout(function () { splash.remove(); }, 600);
                }, wait);
            }

            if (document.readyState === 'complete') hide();
            else window.addEventListener('load', hide);
        })();
    </script>

    <div class="app-container">
        <header class="app-header dashboard-header">
            <div class="logo-container">
                <h1>GymUp</h1>
            </div>
            <p>Veja como está a lotação das academias agora</p>
        </header>

        <main class="app-content">
            <div class="search-card">
                <h3>Encontrar academia</h3>
                <form id="form-busca">
                    <!-- Campo Cidade reativado -->
                    <div class="input-group">
                        <label for="cidade">Cidade</label>
                        <input type="text" id="cidade" name="cidade" placeholder="Ex: Guarujá">
                    </div>
                    <div class="input-group">
                        <label for="academia">Nome da academia (opcional)</label>
                        <input type="text" id="academia" name="academia" placeholder="Ex: SkyFit">
                    </div>
                    <button type="submit" class="btn-primary">Pesquisar lotação</button>
                </form>
            </div>
            <div id="resultados-container" class="results-area"></div>
        </main>

        <nav class="bottom-nav">
            <a href="index.html" class="nav-item active">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M3 11l9-8 9 8" />
                    <path d="M5 10v10h14V10" />
                </svg>
                <span>Início</span>
            </a>
            <a href="historico.html" class="nav-item">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <circle cx="12" cy="12" r="9" />
                    <path d="M12 7v5l3 2" />
                </svg>
                <span>Histórico</span>
            </a>
            <a href="treino.html" class="nav-item">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M6.5 6.5v11M17.5 6.5v11M3 9v6M21 9v6M6.5 12h11" />
                </svg>
                <span>Treino</span>
            </a>
            <a href="perfil.html" class="nav-item">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <circle cx="12" cy="12" r="0" />
                    <circle cx="12" cy="8" r="4" />
                    <path d="M4 21c0-4 4-6 8-6s8 2 8 6" />
                </svg>
                <span>Perfil</span>
            </a>
        </nav>
    </div>

    <script>
        const NIVEIS = { Baixo: ['n1', 'verde'], Moderado: ['n2', 'amarelo'], Alto: ['n3', 'vermelho'] };
        const box = document.getElementById('resultados-container');

        function esc(t) {
            const d = document.createElement('div');
            d.textContent = t == null ? '' : String(t);
            return d.innerHTML;
        }

        function toast(msg, erro) {
            const t = document.createElement('div');
            t.className = 'toast' + (erro ? ' erro' : '');
            t.textContent = msg;
            document.body.appendChild(t);
            setTimeout(() => t.remove(), 3000);
        }

        const cadastrarHTML = `
    <div class="caixa-vazia">
        <p>Não encontrou a academia que procura?</p>
        <a href="cadastrar_academia.html">Cadastre uma nova academia</a>
    </div>`;

        function formatarTempoDecorrido(dataHoraMySQL) {
            if (!dataHoraMySQL) return 'Nenhuma avaliação hoje';

            const dataVoto = new Date(dataHoraMySQL.replace(/-/g, '/'));
            const agora = new Date();

            const diferencaMs = agora - dataVoto;

            const minutos = Math.floor(diferencaMs / (1000 * 60));
            const horas = Math.floor(minutos / 60);
            const dias = Math.floor(horas / 24);

            if (minutos < 1) return 'Atualizado agora mesmo';
            if (minutos < 60) return `Atualizado há ${minutos} min`;
            if (horas === 1) return `Atualizado há 1 hora`;
            if (horas < 24) return `Atualizado há ${horas} horas`;
            if (dias === 1) return 'Atualizado ontem';

            return `Atualizado há ${dias} dias`;
        }

        window.addEventListener('DOMContentLoaded', () => {
            carregarAcademiasPorGPS();
        });

        document.getElementById('form-busca').addEventListener('submit', e => {
            e.preventDefault();
            carregarAcademiasPorGPS();
        });

        function carregarAcademiasPorGPS() {
            // Captura tanto a cidade quanto o nome da academia
            const termoCidade = document.getElementById('cidade').value.trim();
            const termoAcademia = document.getElementById('academia').value.trim();
            box.innerHTML = '<p class="msg-centro">A obter a sua localização GPS...</p>';

            if ("geolocation" in navigator) {
                navigator.geolocation.getCurrentPosition(position => {
                    const lat = position.coords.latitude;
                    const lon = position.coords.longitude;

                    box.innerHTML = '<p class="msg-centro">A procurar academias...</p>';

                    // Envia lat, lon, cidade e academia para o PHP
                    fetch(`buscar_academia.php?lat=${lat}&lon=${lon}&cidade=${encodeURIComponent(termoCidade)}&academia=${encodeURIComponent(termoAcademia)}`)
                        .then(r => r.json())
                        .then(dados => {
                            if (dados.erro || (Array.isArray(dados) && dados.length === 0)) {
                                box.innerHTML = `<p class="msg-centro">Nenhuma academia encontrada.</p>` + cadastrarHTML;
                                return;
                            }
                            box.innerHTML = dados.map(cardAcademia).join('') + cadastrarHTML;
                        })
                        .catch(err => {
                            console.error('Erro:', err);
                            box.innerHTML = '<p class="msg-centro erro">Erro ao ligar ao servidor.</p>';
                        });

                }, error => {
                    console.warn('GPS negado ou indisponível:', error);
                    // Fallback sem GPS, mas com filtro de cidade e academia
                    fetch(`buscar_academia.php?cidade=${encodeURIComponent(termoCidade)}&academia=${encodeURIComponent(termoAcademia)}`)
                        .then(r => r.json())
                        .then(dados => {
                            if (dados.length === 0) {
                                box.innerHTML = '<p class="msg-centro">Nenhuma academia encontrada.</p>' + cadastrarHTML;
                            } else {
                                box.innerHTML = dados.map(cardAcademia).join('') + cadastrarHTML;
                            }
                        })
                        .catch(() => {
                            box.innerHTML = '<p class="msg-centro erro">Erro de conexão.</p>';
                        });
                }, { timeout: 10000, enableHighAccuracy: true });
            } else {
                box.innerHTML = '<p class="msg-centro erro">O seu navegador não suporta geolocalização.</p>';
            }
        }

        function cardAcademia(item) {
            const nivel = NIVEIS[item.statusLotacaoAtual];
            const infoDistancia = item.distancia !== null && item.distancia !== undefined ? ` • a ${item.distancia} km` : '';

            const tempoDecorrido = formatarTempoDecorrido(item.ultimaAtualizacao);

            const podeVotar = item.distancia !== null && item.distancia <= 0.10;

            const disabledAttr = podeVotar ? '' : 'disabled';
            const msgBloqueio = podeVotar ? '' : '<p class="msg-bloqueio" style="font-size: 0.75rem; color: #e53e3e; margin-bottom: 8px;">📍 Tem de estar no local (100m) para votar.</p>';
            const classeOpacidade = podeVotar ? '' : 'style="opacity: 0.6; filter: grayscale(50%);"';

            return `
    <article class="academia-card" id="card-academia-${item.id}">
        <div class="academia-topo">
            <div>
                <h4>${esc(item.nome)}</h4>
                <p>${esc(item.endereco || 'Endereço não informado')}${infoDistancia}</p>
                <p style="font-size: 0.8rem; color: #718096; margin-top: 5px; font-weight: 500;">⏱ ${tempoDecorrido}</p>
            </div>
            <span id="badge-${item.id}" class="status-badge ${nivel ? nivel[1] : 'cinza'}">${nivel ? esc(item.statusLotacaoAtual) : 'Sem avaliações'}</span>
        </div>
        <div id="medidor-${item.id}" class="medidor ${nivel ? nivel[0] : ''}" aria-hidden="true"><span></span><span></span><span></span></div>
        <div class="voto">
            <p class="voto-titulo">Como está agora?</p>
            ${msgBloqueio}
            <div class="voto-botoes" ${classeOpacidade}>
                <button type="button" class="v-baixo" ${disabledAttr} onclick="enviarVoto(${Number(item.id)}, 'Baixo', this)">Tranquila</button>
                <button type="button" class="v-moderado" ${disabledAttr} onclick="enviarVoto(${Number(item.id)}, 'Moderado', this)">Moderada</button>
                <button type="button" class="v-alto" ${disabledAttr} onclick="enviarVoto(${Number(item.id)}, 'Alto', this)">Lotada</button>
            </div>
        </div>
    </article>`;
        }

        function enviarVoto(idAcademia, statusLotacao, btn) {
            const botoes = btn.parentElement.querySelectorAll('button');
            botoes.forEach(b => b.disabled = true);

            const formData = new URLSearchParams();
            formData.append('idAcademia', idAcademia);
            formData.append('status_lotacao', statusLotacao);

            fetch('votar_academia.php', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: formData.toString()
            })
                .then(r => r.text().then(text => {
                    try { return JSON.parse(text); }
                    catch (err) { console.error('Resposta bruta do PHP:', text); throw new Error('Resposta inválida do servidor.'); }
                }))
                .then(res => {
                    if (!res.sucesso) { toast(res.erro || 'Não foi possível votar. Tente de novo.', true); return; }
                    const statusFinal = NIVEIS[res.status] ? res.status : statusLotacao;
                    const [classeMedidor, classeBadge] = NIVEIS[statusFinal];
                    const badge = document.getElementById(`badge-${idAcademia}`);
                    badge.textContent = statusFinal;
                    badge.className = `status-badge ${classeBadge}`;
                    document.getElementById(`medidor-${idAcademia}`).className = `medidor ${classeMedidor}`;

                    const tempoParagrafo = document.querySelector(`#card-academia-${idAcademia} p:nth-of-type(2)`);
                    if (tempoParagrafo) tempoParagrafo.innerHTML = '⏱ Atualizado agora mesmo';

                    toast('Voto registrado. Obrigado por ajudar!');
                })
                .catch(err => {
                    console.error('Erro detalhado:', err);
                    toast('Sem conexão. Seu voto não foi enviado.', true);
                })
                .finally(() => botoes.forEach(b => b.disabled = false));
        }
    </script>
</body>

</html>
