<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <!-- A TAG QUE TORNA O SITE RESPONSIVO NO CELULAR -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitoramento de Academias</title>
    <link rel="stylesheet" href="style.css">

    <!-- Configurações do PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#222222">
</head>
<body>
    <div class="container">
        <h1>Monitor de Lotação</h1>
        <p>Descubra se a academia está cheia em tempo real.</p>

        <div class="card-busca">
            <input type="text" id="cidade" placeholder="Digite sua cidade (ex: Guarujá)">
            <input type="text" id="academia" placeholder="Nome da Academia (ex: Smart Fit)">
            <!-- O botão  chama a função executarBusca() -->
            <button onclick="executarBusca()">Buscar Academia</button>
        </div>
    </div>

    <!-- Importação do arquivo JavaScript principal -->
    <script src="script.js"></script>

    <!-- Registro do Service Worker para o PWA funcionar offline -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(() => console.log('Service Worker registrado com sucesso!'))
                    .catch((err) => console.log('Falha ao registrar Service Worker:', err));
            });
        }
    </script>
</body>
</html>
