<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="icon.png">
    <title>GymUp - Início</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f172a">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Tela de carregamento (fica logo no início do body) -->
    <div class="splash" id="splash" role="status" aria-label="Carregando o GymUp">
        <div class="splash__meter" aria-hidden="true">
            <div class="splash__bar"></div>
            <div class="splash__bar"></div>
            <div class="splash__bar"></div>
            <div class="splash__bar"></div>
        </div>
        <p class="splash__logo">GymUp</p>
    </div>
    <script>
        (function () {
            var splash = document.getElementById('splash');
            if (!splash) return;

            // mostra várias vezes por abertura do app, mas não na mesma tela
            var MIN_MS = 2500;   // tempo mínimo na tela
            var MAX_MS = 8000;   // segurança: some mesmo se algo travar
            var start = Date.now();
            var done = false;

            function hide() {
                if (done) return;
                done = true;
                try { sessionStorage.setItem('gymup-splash', '1'); } catch (e) { }
                var wait = Math.max(0, MIN_MS - (Date.now() - start));
                setTimeout(function () {
                    splash.classList.add('splash--out');
                    setTimeout(function () { splash.remove(); }, 600);
                }, wait);
            }

            if (document.readyState === 'complete') hide();
            else window.addEventListener('load', hide);
        })();
    </script>

    <div class="app-container">
        <header class="app-header dashboard-header">
            <div class="logo-container">
                <h1>GymUp</h1>
            </div>
            <p>Veja como está a lotação das academias agora</p>
        </header>

        <main class="app-content">
            <div class="search-card">
                <h3>Encontrar academia</h3>
                <form id="form-busca">
                    <div class="input-group">
                        <label for="cidade">Cidade</label>
                        <input type="text" id="cidade" name="cidade" required>
                    </div>
                    <div class="input-group">
                        <label for="academia">Nome da academia (opcional)</label>
                        <input type="text" id="academia" name="academia">
                    </div>
                    <button type="submit" class="btn-primary">Pesquisar lotação</button>
                </form>
            </div>
            <div id="resultados-container" class="results-area"></div>
        </main>

        <nav class="bottom-nav">
            <a href="index.html" class="nav-item active">Início</a>
            <a href="historico.html" class="nav-item">Histórico</a>
            <a href="perfil.html" class="nav-item">Perfil</a>
        </nav>
    </div>

    <script>
        const NIVEIS = { Baixo: ['n1', 'verde'], Moderado: ['n2', 'amarelo'], Alto: ['n3', 'vermelho'] };
        const box = document.getElementById('resultados-container');

        // Evita que nomes/endereços com caracteres especiais quebrem a tela
        function esc(t) {
            const d = document.createElement('div');
            d.textContent = t == null ? '' : String(t);
            return d.innerHTML;
        }

        function toast(msg, erro) {
            const t = document.createElement('div');
            t.className = 'toast' + (erro ? ' erro' : '');
            t.textContent = msg;
            document.body.appendChild(t);
            setTimeout(() => t.remove(), 3000);
        }

        const cadastrarHTML = `
    <div class="caixa-vazia">
        <p>Não encontrou a academia que procura?</p>
        <a href="cadastrar_academia.html">Cadastre uma nova academia</a>
    </div>`;

        document.getElementById('form-busca').addEventListener('submit', e => {
            e.preventDefault();
            realizarBusca();
        });

        function realizarBusca() {
            const cidade = encodeURIComponent(document.getElementById('cidade').value.trim());
            const academia = encodeURIComponent(document.getElementById('academia').value.trim());
            box.innerHTML = '<p class="msg-centro">Pesquisando...</p>';

            fetch(`buscar_academia.php?cidade=${cidade}&academia=${academia}`)
                .then(r => r.text().then(text => {
                    try { return JSON.parse(text); }
                    catch (err) { throw new Error('O servidor retornou uma resposta inválida.'); }
                }))
                .then(dados => {
                    if (dados.erro || (Array.isArray(dados) && dados.length === 0)) {
                        box.innerHTML = `<p class="msg-centro">${esc(dados.erro || 'Nenhuma academia encontrada nesta região.')}</p>` + cadastrarHTML;
                        return;
                    }
                    box.innerHTML = dados.map(cardAcademia).join('') + cadastrarHTML;
                })
                .catch(err => {
                    console.error('Erro detalhado:', err);
                    box.innerHTML = '<p class="msg-centro erro">Não foi possível conectar ao servidor. Tente de novo.</p>';
                });
        }

        function cardAcademia(item) {
            const nivel = NIVEIS[item.statusLotacaoAtual];
            return `
    <article class="academia-card" id="card-academia-${item.id}">
        <div class="academia-topo">
            <div>
                <h4>${esc(item.nome)}</h4>
                <p>${esc(item.endereco || 'Endereço não informado')}</p>
            </div>
            <span id="badge-${item.id}" class="status-badge ${nivel ? nivel[1] : 'cinza'}">${nivel ? esc(item.statusLotacaoAtual) : 'Sem avaliações'}</span>
        </div>
        <div id="medidor-${item.id}" class="medidor ${nivel ? nivel[0] : ''}" aria-hidden="true"><span></span><span></span><span></span></div>
        <div class="voto">
            <p class="voto-titulo">Como está agora?</p>
            <div class="voto-botoes">
                <button type="button" class="v-baixo" onclick="enviarVoto(${Number(item.id)}, 'Baixo', this)">Tranquila</button>
                <button type="button" class="v-moderado" onclick="enviarVoto(${Number(item.id)}, 'Moderado', this)">Moderada</button>
                <button type="button" class="v-alto" onclick="enviarVoto(${Number(item.id)}, 'Alto', this)">Lotada</button>
            </div>
        </div>
    </article>`;
        }

        function enviarVoto(idAcademia, statusLotacao, btn) {
            const botoes = btn.parentElement.querySelectorAll('button');
            botoes.forEach(b => b.disabled = true);

            const formData = new URLSearchParams();
            formData.append('idAcademia', idAcademia);
            formData.append('status_lotacao', statusLotacao);

            fetch('votar_academia.php', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: formData.toString()
            })
                .then(r => r.text().then(text => {
                    try { return JSON.parse(text); }
                    catch (err) { console.error('Resposta bruta do PHP:', text); throw new Error('Resposta inválida do servidor.'); }
                }))
                .then(res => {
                    if (!res.sucesso) { toast(res.erro || 'Não foi possível votar. Tente de novo.', true); return; }
                    const statusFinal = NIVEIS[res.status] ? res.status : statusLotacao;
                    const [classeMedidor, classeBadge] = NIVEIS[statusFinal];
                    const badge = document.getElementById(`badge-${idAcademia}`);
                    badge.textContent = statusFinal;
                    badge.className = `status-badge ${classeBadge}`;
                    document.getElementById(`medidor-${idAcademia}`).className = `medidor ${classeMedidor}`;
                    toast('Voto registrado. Obrigado por ajudar!');
                })
                .catch(err => {
                    console.error('Erro detalhado:', err);
                    toast('Sem conexão. Seu voto não foi enviado.', true);
                })
                .finally(() => botoes.forEach(b => b.disabled = false));
        }
    </script>
    <script src="pwa.js"></script>
</body>

</html>
