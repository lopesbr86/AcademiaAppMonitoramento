<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Bruna Lopes, Danilo Ferreira, Júlia Ribeiro, Lydia Aquino, Luísa Marçal">
    <meta name="description" content="App Monitoramento de Lotação em Academia, GymUp">
    <meta name="keywords" content="etec, app, academia, treino, saúde, lotação">
    <link rel="stylesheet" href="login.css">
    <title>Login - GymUp</title>
</head>

<body>
    <div class="login-container">

        <div class="login-header">
            <img src="[https://via.placeholder.com/100](https://via.placeholder.com/100)" alt="Logo GymCheck"
                class="profile-img">
            <h2>GymCheck</h2>
            <p>Acompanhe a lotação em tempo real</p>
        </div>

        <form action="login.php" method="POST" class="login-form">
            <div class="input-group">
                <label for="email">E-mail</label>
                <div class="input-wrapper">
                    <i class="fa-regular fa-envelope"></i>
                    <input type="email" id="email" name="email" placeholder="seu@email.com" required>
                </div>
            </div>

            <div class="input-group">
                <label for="senha">Senha</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" id="senha" name="senha" placeholder="••••••••" required>
                </div>
            </div>

            <div class="form-actions">
                <a href="esqueciSenha.html" class="forgot-pass">Esqueceu a senha?</a>
            </div>

            <button type="submit" class="btn-login">Entrar</button>
        </form>

        <div class="login-footer">
            <p>Ainda não tem conta? <a href="cadastro.html">Cadastre-se</a></p>
        </div>

    </div>

</body>

</html>
