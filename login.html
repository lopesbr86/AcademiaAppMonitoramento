<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0f172a">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="icon.png">
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">
    <title>GymUp - Entrar</title>
</head>

<body>

    <!-- Tela de carregamento (fica logo no início do body) -->
    <div class="splash" id="splash" role="status" aria-label="Carregando o GymUp">
        <div class="splash__meter" aria-hidden="true">
            <div class="splash__bar"></div>
            <div class="splash__bar"></div>
            <div class="splash__bar"></div>
            <div class="splash__bar"></div>
        </div>
        <p class="splash__logo">GymUp</p>
    </div>
    <script>
        (function () {
            var splash = document.getElementById('splash');
            if (!splash) return;

            // mostra só uma vez por abertura do app
            try {
                if (sessionStorage.getItem('gymup-splash') === '1') { splash.remove(); return; }
            } catch (e) { }

            var MIN_MS = 5000;   // tempo mínimo na tela
            var MAX_MS = 10000;   // segurança: some mesmo se algo travar
            var start = Date.now();
            var done = false;

            function hide() {
                if (done) return;
                done = true;
                try { sessionStorage.setItem('gymup-splash', '1'); } catch (e) { }
                var wait = Math.max(0, MIN_MS - (Date.now() - start));
                setTimeout(function () {
                    splash.classList.add('splash--out');
                    setTimeout(function () { splash.remove(); }, 600);
                }, wait);
            }

            if (document.readyState === 'complete') hide();
            else window.addEventListener('load', hide);
            setTimeout(hide, MAX_MS);
        })();
    </script>

    <div class="app-container">
        <header class="app-header">
            <div class="logo-container">
                <h1>GymUp</h1>
            </div>
            <p>Entre para ver a lotação das academias</p>
        </header>

        <main class="app-content">
            <div class="search-card">
                <div id="alerta-feedback" class="alerta-feedback"></div>
                <form action="processar_login.php" method="POST">
                    <div class="input-group">
                        <label for="email">E-mail</label>
                        <input type="email" id="email" name="email" placeholder="seu@email.com" autocomplete="email"
                            required>
                    </div>
                    <div class="input-group">
                        <label for="senha">Senha</label>
                        <input type="password" id="senha" name="senha" placeholder="********"
                            autocomplete="current-password" required>
                    </div>
                    <div class="forgot-password"><a href="esqueciSenha.html">Esqueceu a senha?</a></div>
                    <button type="submit" class="btn-primary">Entrar</button>
                </form>
                <div class="card-footer-link">
                    <p>Não tem uma conta? <a href="cadastro.html">Cadastre-se</a></p>
                </div>
            </div>
        </main>
    </div>
    <script>
        const status = new URLSearchParams(window.location.search).get("status");
        const aviso = document.getElementById("alerta-feedback");
        function mostrar(tipo, texto) { aviso.className = "alerta-feedback " + tipo; aviso.textContent = texto; }
        if (status === "erro_login") mostrar("erro", "E-mail ou senha incorretos.");
        else if (status === "erro_campos") mostrar("erro", "Preencha o e-mail e a senha.");
        else if (status === "erro_conexao") mostrar("erro", "Não foi possível conectar. Tente de novo.");
        else if (status === "erro_nao_verificado") mostrar("erro", "Confirme seu e-mail antes de entrar. Verifique sua caixa de entrada e a pasta de spam.");
        else if (status === "verificado") mostrar("sucesso", "E-mail confirmado! Já pode entrar.");
        else if (status === "senha_alterada") mostrar("sucesso", "Senha alterada com sucesso. Já pode entrar.");
        else if (status === "link_invalido") mostrar("erro", "Link inválido ou já utilizado.");
    </script>
    <script src="mostrar-senha.js"></script>
    <script src="pwa.js"></script>
</body>

</html>
