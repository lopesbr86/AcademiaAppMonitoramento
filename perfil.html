<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="icon.png">
    <meta name="theme-color" content="#0f172a">
    <link rel="manifest" href="manifest.json">
    <title>GymUp - Meu Perfil</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="app-container">
        <header class="app-header dashboard-header">
            <div class="logo-container">
                <h1>GymUp</h1>
            </div>
            <p>Gerencie o acesso à sua conta</p>
        </header>

        <main class="app-content">
            <div class="search-card perfil-centro">
                <div id="alerta-feedback" class="alerta-feedback"></div>

                <div id="painel-perfil">
                    <div class="perfil-avatar" aria-hidden="true">👤</div>
                    <h3>Minha conta</h3>
                    <p>Gerencie a segurança da sua conta GymUp</p>

                    <div class="perfil-acoes">
                        <a href="alterarSenha.html" class="btn-primary">Alterar senha</a>
                        <a href="login.html" class="link-sair">Sair da conta</a>
                        <hr>
                        <button type="button" class="btn-perigo" onclick="alternarPainel(true)">Excluir minha
                            conta</button>
                    </div>
                </div>

                <div id="painel-confirmacao" hidden>
                    <div class="icone-alerta" aria-hidden="true">⚠️</div>
                    <h3>Excluir conta?</h3>
                    <p>Esta ação não pode ser desfeita. Todos os seus dados serão apagados permanentemente.</p>
                    <div class="confirmacao-acoes">
                        <button type="button" class="btn-secundario" onclick="alternarPainel(false)">Cancelar</button>
                        <a href="processar_excluir_conta.php" class="btn-perigo">Sim, excluir</a>
                    </div>
                </div>
            </div>
        </main>

        <nav class="bottom-nav">
            <a href="index.html" class="nav-item">Início</a>
            <a href="historico.html" class="nav-item">Histórico</a>
            <a href="treino.html" class="nav-item">Treino</a>
            <a href="perfil.html" class="nav-item active">Perfil</a>
        </nav>
    </div>

    <script>
        function alternarPainel(confirmar) {
            document.getElementById('painel-perfil').hidden = confirmar;
            document.getElementById('painel-confirmacao').hidden = !confirmar;
        }

        const status = new URLSearchParams(window.location.search).get('status');
        if (status === 'erro_exclusao') {
            const aviso = document.getElementById('alerta-feedback');
            aviso.className = 'alerta-feedback erro';
            aviso.textContent = 'Não foi possível excluir a conta. Tente de novo.';
        }
    </script>
    <script src="pwa.js"></script>
</body>

</html>
