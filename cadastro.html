<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0f172a">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="icon.png">
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">
    <title>GymUp - Criar Conta</title>
</head>

<body>
    <div class="app-container">
        <header class="app-header">
            <div class="logo-container">
                <h1>GymUp</h1>
            </div>
            <p>Crie sua conta para avaliar e acompanhar academias</p>
        </header>

        <main class="app-content">
            <div class="search-card">
                <div id="alerta-feedback" class="alerta-feedback"></div>
                <form action="processar_cadastro.php" method="POST">
                    <div class="input-group">
                        <label for="nome">Nome completo</label>
                        <input type="text" id="nome" name="nome" placeholder="Seu nome completo" autocomplete="name"
                            required>
                    </div>
                    <div class="input-group">
                        <label for="email">E-mail</label>
                        <input type="email" id="email" name="email" placeholder="seu@email.com" autocomplete="email"
                            required>
                    </div>
                    <div class="input-group">
                        <label for="senha">Senha</label>
                        <input type="password" id="senha" name="senha" placeholder="********"
                            autocomplete="new-password" required>
                    </div>
                    <div class="input-group">
                        <label for="confirma_senha">Confirmar senha</label>
                        <input type="password" id="confirma_senha" name="confirma_senha" placeholder="********"
                            autocomplete="new-password" required>
                    </div>
                    <button type="submit" class="btn-primary">Criar conta</button>
                </form>
                <div class="card-footer-link">
                    <p>Já tem uma conta? <a href="login.html">Faça login</a></p>
                </div>
            </div>
        </main>
    </div>
    <script>
        const status = new URLSearchParams(window.location.search).get("status");
        const aviso = document.getElementById("alerta-feedback");
        function mostrar(tipo, texto) { aviso.className = "alerta-feedback " + tipo; aviso.textContent = texto; }
        if (status === "sucesso") mostrar("sucesso", "Conta criada com sucesso!");
        else if (status === "erro_email") mostrar("erro", "Este e-mail já está cadastrado. Tente outro.");
        else if (status === "erro_senha") mostrar("erro", "As senhas não coincidem ou há campos vazios.");
    </script>
    <script src="mostrar-senha.js"></script>
    <script src="pwa.js"></script>
</body>

</html>
