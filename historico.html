<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="icon.png">
    <meta name="theme-color" content="#0f172a">
    <link rel="manifest" href="manifest.json">
    <title>GymUp - Histórico</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="app-container">
        <header class="app-header dashboard-header">
            <div class="logo-container">
                <h1>GymUp</h1>
            </div>
            <p>Suas consultas e votos</p>
        </header>

        <main class="app-content">
            <div class="search-card">
                <h3>Suas últimas contribuições</h3>

                <!-- Exemplo: troque pelos itens reais do seu sistema -->
                <div class="historico-item">
                    <div class="historico-topo">
                        <strong class="historico-titulo">Smart Fit - Centro</strong>
                        <span class="status-badge amarelo">Moderada</span>
                    </div>
                    <span class="historico-data">Hoje, 14:30</span>
                </div>
                <div class="historico-item">
                    <div class="historico-topo">
                        <strong class="historico-titulo">Bluefit - Enseada</strong>
                        <span class="status-badge verde">Tranquila</span>
                    </div>
                    <span class="historico-data">Ontem, 18:15</span>
                </div>
            </div>
        </main>

        <nav class="bottom-nav">
            <a href="index.html" class="nav-item">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M3 11l9-8 9 8" />
                    <path d="M5 10v10h14V10" />
                </svg>
                <span>Início</span>
            </a>
            <a href="historico.html" class="nav-item active">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <circle cx="12" cy="12" r="9" />
                    <path d="M12 7v5l3 2" />
                </svg>
                <span>Histórico</span>
            </a>
            <a href="treino.html" class="nav-item">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M6.5 6.5v11M17.5 6.5v11M3 9v6M21 9v6M6.5 12h11" />
                </svg>
                <span>Treino</span>
            </a>
            <a href="perfil.html" class="nav-item">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <circle cx="12" cy="12" r="0" />
                    <circle cx="12" cy="8" r="4" />
                    <path d="M4 21c0-4 4-6 8-6s8 2 8 6" />
                </svg>
                <span>Perfil</span>
            </a>
        </nav>
    </div>
    <script src="pwa.js"></script>
</body>

</html>
