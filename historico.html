<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GymUp - Histórico</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app-container">
        <header class="app-header dashboard-header">
            <div class="logo-container" style="justify-content: flex-start; margin-bottom: 0;">
                <h1>GymUp</h1>
            </div>
            <p>Histórico de Consultas e Votos</p>
        </header>

        <main class="app-content">
            <div class="search-card">
                <h3 style="font-size: 1rem; margin-bottom: 12px; color: #1a202c;">Suas Últimas Contribuições</h3>

                <!-- Exemplo de itens de histórico -->
                <div style="border-bottom: 1px solid #edf2f7; padding: 10px 0;">
                    <strong style="font-size: 0.9rem; color: #2d3748;">Smart Fit - Centro</strong>
                    <p style="font-size: 0.78rem; color: #718096;">Reportado como: Moderada</p>
                    <span style="font-size: 0.72rem; color: #a0aec0;">Hoje, 14:30</span>
                </div>

                <div style="padding: 10px 0;">
                    <strong style="font-size: 0.9rem; color: #2d3748;">Bluefit - Enseada</strong>
                    <p style="font-size: 0.78rem; color: #718096;">Reportado como: Vazia / Tranquila</p>
                    <span style="font-size: 0.72rem; color: #a0aec0;">Ontem, 18:15</span>
                </div>
            </div>
        </main>

        <nav class="bottom-nav">
            <a href="index.html" class="nav-item">Início</a>
            <a href="historico.html" class="nav-item active">Histórico</a>
            <a href="perfil.html" class="nav-item">Perfil</a>
        </nav>
    </div>

</body>
</html>
