<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0f172a">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="icon.png">
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">
    <title>GymUp - Recuperar Senha</title>
</head>

<body>
    <div class="app-container">
        <header class="app-header">
            <div class="logo-container">
                <img src="logo.png" alt="" class="app-logo" onerror="this.style.display='none'">
                <h1>GymUp</h1>
            </div>
            <p>Recupere o acesso à sua conta</p>
        </header>

        <main class="app-content">
            <div class="search-card">
                <p class="card-instruction">Digite o e-mail cadastrado. Enviaremos as instruções para você redefinir a
                    senha.</p>
                <form action="processar_recuperacao.php" method="POST">
                    <div class="input-group">
                        <label for="email">E-mail</label>
                        <input type="email" id="email" name="email" placeholder="seu@email.com" autocomplete="email"
                            required>
                    </div>
                    <button type="submit" class="btn-primary">Enviar instruções</button>
                </form>
                <div class="card-footer-link">
                    <p>Lembrou da senha? <a href="login.html">Faça login</a></p>
                </div>
            </div>
        </main>

        <nav class="bottom-nav">
            <a href="index.html" class="nav-item">Início</a>
            <a href="login.html" class="nav-item active">Minha conta</a>
        </nav>
    </div>
    <script src="pwa.js"></script>
</body>

</html>
