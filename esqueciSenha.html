<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GymUp - Recuperar Senha</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app-container">
        
        <header class="app-header">
            <div class="logo-container">
                <!-- Espaço reservado para o logo oficial -->
                <img src="logo.png" alt="GymUp Logo" class="app-logo" onerror="this.style.display='none'">
                <h1>GymUp</h1>
            </div>
            <p></p>
        </header>

        <!-- Conteúdo -->
        <main class="app-content">
            <div class="search-card">
                <p class="card-instruction">
                    Digite o e-mail cadastrado abaixo. Enviaremos as instruções para você redefinir a sua senha.
                </p>

                <form action="processar_recuperacao.php" method="POST">
                    <div class="input-group">
                        <label for="email">E-mail</label>
                        <input type="email" id="email" name="email" placeholder="seu@email.com" required>
                    </div>

                    <button type="submit" class="btn-primary">Enviar Instruções</button>
                </form>

                <div class="card-footer-link">
                    <p>Lembrou da senha? <a href="login.html">Faça login</a></p>
                </div>
            </div>
        </main>

        <!-- Barra de Navegação Inferior -->
        <nav class="bottom-nav">
            <a href="index.html" class="nav-item">Início</a>
            <a href="login.html" class="nav-item active">Minha Conta</a>
        </nav>
    </div>

</body>
</html>
