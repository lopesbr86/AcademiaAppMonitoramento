<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0f172a">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="icon.png">
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">
    <title>GymUp - Cadastrar Academia</title>
</head>

<body>
    <div class="app-container">
        <header class="app-header">
            <div class="logo-container">
                <h1>GymUp</h1>
            </div>
            <p>Cadastre uma academia que ainda não está no app</p>
        </header>

        <main class="app-content">
            <div class="search-card">
                <div id="alerta-feedback" class="alerta-feedback"></div>
                
                <form id="form-cadastro" action="processar_cadastro_academia.php" method="POST">
                    <div class="input-group">
                        <label for="nome">Nome da academia</label>
                        <input type="text" id="nome" name="nome" placeholder="Ex: Smart Fit">
                    </div>

                    <!-- Campo de Cidade Separado -->
                    <div class="input-group">
                        <label for="cidade">Cidade</label>
                        <input type="text" id="cidade" name="cidade" placeholder="Ex: Guarujá ou Santos">
                    </div>

                    <!-- Campo de Rua Separado -->
                    <div class="input-group">
                        <label for="rua">Rua / Logradouro</label>
                        <input type="text" id="rua" name="rua" placeholder="Ex: Av. Ana Costa">
                    </div>

                    <!-- Campo de Número Separado -->
                    <div class="input-group">
                        <label for="numero">Número</label>
                        <input type="text" id="numero" name="numero" placeholder="Ex: 100">
                    </div>

                    <div class="input-group">
                        <label for="status_lotacao">Lotação inicial</label>
                        <select id="status_lotacao" name="status_lotacao">
                            <option value="Baixo">Baixo</option>
                            <option value="Moderado" selected>Moderado</option>
                            <option value="Alto">Alto</option>
                        </select>
                    </div>
                    <button type="submit" class="btn-primary">Salvar academia</button>
                </form>

                <div class="card-footer-link"><a href="index.php">Voltar ao início</a></div>
            </div>
        </main>
    </div>

    <script>
        // Função auxiliar para exibir o Toast moderno na tela
        function mostrarToast(mensagem, ehErro = false) {
            const toastAntigo = document.querySelector('.toast');
            if (toastAntigo) toastAntigo.remove();

            const toast = document.createElement('div');
            toast.className = `toast ${ehErro ? 'erro' : ''}`;
            toast.innerText = mensagem;

            document.body.appendChild(toast);

            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transition = 'opacity 0.3s ease';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        // Tratamento de mensagens via URL (sucesso ou erros vindos do PHP)
        const urlParams = new URLSearchParams(window.location.search);
        const status = urlParams.get("status");
        const erro = urlParams.get("erro");

        if (status === "sucesso") {
            mostrarToast("Academia cadastrada com sucesso!");
        } else if (erro === "duplicada") {
            mostrarToast("Esta academia ou endereço já está cadastrada!", true);
        } else if (erro === "campos_vazios" || status === "erro") {
            mostrarToast("Por favor, preencha todos os campos corretamente.", true);
        }

        // Validação no envio para evitar o balão padrão do navegador
        document.addEventListener("DOMContentLoaded", () => {
            const formCadastro = document.getElementById("form-cadastro");

            if (formCadastro) {
                formCadastro.addEventListener("submit", function(e) {
                    const nome = document.getElementById("nome").value.trim();
                    const cidade = document.getElementById("cidade").value.trim();
                    const rua = document.getElementById("rua").value.trim();
                    const numero = document.getElementById("numero").value.trim();

                    if (!nome || !cidade || !rua || !numero) {
                        e.preventDefault();
                        mostrarToast("Preencha todos os campos para continuar.", true);
                    }
                });
            }
        });
    </script>

    <script src="pwa.js"></script>
    
    <script>
    // Preenche automaticamente a cidade se vier informada pela busca
    document.addEventListener("DOMContentLoaded", () => {
        const urlParams = new URLSearchParams(window.location.search);
        const cidadeURL = urlParams.get("cidade");
        const nomeURL = urlParams.get("nome");

        if (cidadeURL) {
            const inputCidade = document.getElementById("cidade"); // Certifica-te de dar id="cidade" no input do HTML de cadastro
            if (inputCidade) inputCidade.value = cidadeURL;
        }
        if (nomeURL) {
            const inputNome = document.getElementById("nome");
            if (inputNome) inputNome.value = nomeURL;
        }
    });
</script>
</body>

</html>
