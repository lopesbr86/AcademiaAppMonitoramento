<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0f172a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="icon.png">
    <link rel="stylesheet" href="style.css">
    <title>GymUp - Cadastrar Academia</title>
</head>

<body>
    <div class="app-container">
        <header class="app-header">
            <div class="logo-container">
                <h1>GymUp</h1>
            </div>
            <p>Cadastre uma academia que ainda não está no app</p>
        </header>

        <main class="app-content">
            <div class="search-card">
                <div id="alerta-feedback" class="alerta-feedback"></div>
                <form action="processar_cadastro_academia.php" method="POST">
                    <div class="input-group">
                        <label for="nome">Nome da academia</label>
                        <input type="text" id="nome" name="nome" required>
                    </div>
                    <div class="input-group">
                        <label for="endereco">Cidade / endereço</label>
                        <input type="text" id="endereco" name="endereco" required>
                    </div>
                    <div class="input-group">
                        <label for="status_lotacao">Lotação inicial</label>
                        <select id="status_lotacao" name="status_lotacao">
                            <option value="Baixo">Baixo</option>
                            <option value="Moderado" selected>Moderado</option>
                            <option value="Alto">Alto</option>
                        </select>
                    </div>
                    <button type="submit" class="btn-primary">Salvar academia</button>
                </form>
                <div class="card-footer-link"><a href="index.html">Voltar ao início</a></div>
            </div>
        </main>
    </div>
    <script>
        const status = new URLSearchParams(window.location.search).get("status");
        const aviso = document.getElementById("alerta-feedback");
        function mostrar(tipo, texto) { aviso.className = "alerta-feedback " + tipo; aviso.textContent = texto; }
        if (status === "sucesso") mostrar("sucesso", "Academia cadastrada com sucesso!");
        else if (status === "erro") mostrar("erro", "Não foi possível cadastrar a academia. Tente de novo.");
    </script>
    <script src="pwa.js"></script>
</body>

</html>
